<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Connect 4</title>

<!--
    Cross-origin isolation shim: the 7x5 solver is a multithreaded WASM build
    and needs SharedArrayBuffer, which requires COOP/COEP headers.
    Script from: https://github.com/gzuidhof/coi-serviceworker
-->
<script src="variants/7x5/coi-serviceworker.js"></script>

<!--
    7x5 solver (c4/ui/artifact/wasm): classic Emscripten build exposing a
    global `Module`. `locateFile` must be defined before the script loads so
    solver.data and solver.wasm resolve to the right folder.
-->
<script>
var Module = {
    locateFile(path, prefix){
        if(path === "solver.data") return "variants/7x5/wasm/solver.data";
        return prefix + path;
    },
    onRuntimeInitialized(){
        Module.ready = true;
        window.dispatchEvent(new Event("solver5x7-ready"));
    },
    onAbort(what){
        Module.loadError = String(what);
        window.dispatchEvent(new Event("solver5x7-error"));
    }
};
</script>
<script defer src="variants/7x5/wasm/solver.js"></script>

<style>
:root{
    --bg:#09090b;
    --panel:rgba(255,255,255,.08);
    --glass:rgba(255,255,255,.06);
    --border:rgba(255,255,255,.15);
    --text:#f4f4f5;
    --muted:#a1a1aa;
    --red:#ff4d6d;
    --yellow:#ffd43b;
    --board:#18181b;
    --cell:#0f172a;
    --shadow:0 12px 35px rgba(0,0,0,.45);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,Segoe UI,Arial,sans-serif;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    overflow-x:hidden;
    overflow-y:auto;
    background:
        radial-gradient(circle at top left,#3b0764 0%,transparent 40%),
        radial-gradient(circle at bottom right,#0f766e 0%,transparent 35%),
        var(--bg);
    color:var(--text);
}

/* ---------- Layout ---------- */

.app-shell{
    width:100%;
    min-height:100vh;
    padding:24px;
}

.layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) 380px;
    gap:24px;
    align-items:start;
    max-width:1400px;
    margin:0 auto;
}

.game-panel{
    display:flex;
    justify-content:center;
    align-items:center;
    min-width:0;
}

.sidebar{
    display:flex;
    flex-direction:column;
    overflow:hidden;
    width:100%;
    min-width:0;
}

.card{
    width:100%;
    max-width:850px;
    backdrop-filter:blur(18px);
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:24px;
    box-shadow:var(--shadow);
    padding:22px;
}

h1{
    text-align:center;
    margin-bottom:18px;
    letter-spacing:.05em;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:20px;
}

.turn{
    font-weight:700;
    padding:10px 16px;
    border-radius:14px;
    background:var(--glass);
    border:1px solid var(--border);
}

.scores{
    display:flex;
    gap:12px;
}

.score{
    min-width:110px;
    text-align:center;
    padding:10px 16px;
    border-radius:14px;
    background:var(--glass);
    border:1px solid var(--border);
}

.score span{
    display:block;
    font-size:1.5rem;
    margin-top:4px;
}

/* ---------- AI switch ---------- */

.ai-switch{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:6px;
    min-width:228px;
    padding:6px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.12);
    border-radius:999px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
}

.ai-switch:disabled{
    opacity:.45;
    cursor:not-allowed;
    pointer-events:none;
}

.ai-option{
    border:none;
    padding:10px 14px;
    border-radius:999px;
    background:transparent;
    color:var(--muted);
    font-size:.85rem;
    font-weight:700;
    letter-spacing:.04em;
    transition:background .2s, color .2s, box-shadow .2s, transform .2s;
}

.ai-option:hover{
    background:rgba(255,255,255,.07);
}

.ai-option.active{
    color:var(--text);
    background:rgba(255,255,255,.12);
    box-shadow:0 0 0 1px rgba(255,255,255,.08), 0 10px 18px rgba(0,0,0,.18);
}

.ai-option[data-mode="1"].active{
    color:#ffe5eb;
    background:linear-gradient(180deg, rgba(255,77,109,.34), rgba(255,77,109,.18));
    box-shadow:0 0 0 1px rgba(255,77,109,.3), 0 0 18px rgba(255,77,109,.22);
}

.ai-option[data-mode="2"].active{
    color:#fff7cf;
    background:linear-gradient(180deg, rgba(255,212,59,.34), rgba(255,212,59,.18));
    box-shadow:0 0 0 1px rgba(255,212,59,.28), 0 0 18px rgba(255,212,59,.2);
}

/* ---------- Board ---------- */

.board-wrap{
    position:relative;
}

.board{
    margin:0 auto;
    display:grid;
    gap:10px;
    width:auto;
    height:auto;
    background:var(--board);
    padding:14px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,.1);
}

.cell{
    position:relative;
    aspect-ratio:1;
    background:#0b1220;
    border-radius:50%;
    overflow:hidden;
    cursor:pointer;
    transition:.2s;
}

.cell:hover{
    transform:scale(1.04);
}

.token{
    position:absolute;
    inset:6%;
    border-radius:50%;
    transform:translateY(-850%);
    transition:transform .45s cubic-bezier(.2,.8,.2,1), opacity .25s;
    opacity:0;
}

.token.show{
    transform:translateY(0);
    opacity:1;
}

.red{
    background:radial-gradient(circle at 35% 30%,#fff4,transparent 30%),var(--red);
    box-shadow:0 0 20px rgba(255,77,109,.5);
}

.yellow{
    background:radial-gradient(circle at 35% 30%,#fff5,transparent 30%),var(--yellow);
    box-shadow:0 0 20px rgba(255,212,59,.5);
}

.ghost{
    opacity:.35 !important;
    transform:translateY(0) !important;
}

.heat-win{
    box-shadow:0 0 18px #00ff88, inset 0 0 18px #00ff88;
}

.heat-loss{
    box-shadow:0 0 18px #ff3b5c, inset 0 0 18px #ff3b5c;
}

.heat-draw{
    box-shadow:0 0 18px #ffd43b, inset 0 0 18px #ffd43b;
}

/* ---------- Score strip ---------- */

.score-strip{
    display:grid;
    gap:10px;
    width:auto;
    margin:14px auto 0;
    text-align:center;
    font-size:.9rem;
    letter-spacing:.05em;
}

.score-value{
    position:relative;
    padding:8px 0;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.04);
    font-weight:700;
    transition:transform .2s, box-shadow .2s, border-color .2s;
}

.score-value.best{
    transform:translateY(-2px);
    border-color:rgba(255,255,255,.35);
    box-shadow:0 0 0 1px rgba(255,255,255,.12), 0 0 18px rgba(255,255,255,.14);
}

.score-value.best::after{
    content:"▲";
    position:absolute;
    top:-16px;
    left:50%;
    transform:translateX(-50%);
    font-size:.72rem;
    color:#f4f4f5;
}

/* ---------- Bottom bar ---------- */

.bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    margin-top:28px;
}

.glass-btn{
    padding:14px 34px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(18px);
    color:var(--text);
    border-radius:16px;
    transition:transform .2s, background .2s;
}

.glass-btn:hover{
    transform:scale(1.04);
    background:rgba(255,255,255,.12);
}

#analysisText{
    font-family:sans-serif;
    font-weight:600;
    letter-spacing:.03em;
    font-size:.92rem;
    color:var(--text);
    text-shadow:0 0 12px rgba(255,255,255,.06);
}

/* ---------- Tabs / sidebar ---------- */

.tab-panel{
    display:flex;
    flex-direction:column;
    height:100%;
    backdrop-filter:blur(18px);
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    border-radius:24px;
    overflow:hidden;
}

.tab-header{
    display:flex;
    padding:12px;
    gap:8px;
}

.tab{
    flex:1;
    background:transparent;
    color:#bbb;
    border:1px solid rgba(255,255,255,.08);
    transition:.25s;
    padding:8px;
}

.tab.active{
    color:white;
    background:rgba(255,255,255,.08);
    box-shadow:0 0 12px rgba(0,255,255,.25);
}

.tab-content{
    flex:1;
    overflow:hidden;
}

.tab-view{
    display:none;
    padding:24px 16px;
}

.tab-view.active{
    display:block;
}

/* ---------- Sliders ---------- */

.slider-group{
    display:flex;
    flex-direction:column;
    gap:36px;
}

.slider-group label{
    display:flex;
    align-items:center;
    flex-direction:column;
    gap:14px;
    font-weight:600;
    letter-spacing:.04em;
    color:var(--muted);
}

.slider-group input[type=range]{
    width:85%;
    max-width:1080px;
    height:10px;
    appearance:none;
    border-radius:999px;
    background:rgba(255,255,255,.12);
    cursor:pointer;
}

.slider-group input[type=range]::-webkit-slider-thumb{
    appearance:none;
    width:18px;
    height:18px;
    border-radius:50%;
    background:#4fd1ff;
    border:2px solid white;
}

.slider-control{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.slider-label{
    font-size:.9rem;
    color:var(--muted);
    font-weight:600;
}

.slider-scale{
    display:flex;
    justify-content:space-between;
    width:100%;
    max-width:300px;
    margin:-2px auto 0;
    font-size:.75rem;
    color:var(--muted);
}

.slider-scale span{
    display:inline-block;
    font-variant-numeric:tabular-nums;
    width:2ch;
    text-align:center;
}

.slider-value{
    display:inline-block;
    margin-top:6px;
    font-size:.95rem;
    color:var(--text);
    font-weight:600;
}

/* ---------- History ---------- */

#historyTable{
    width:100%;
    table-layout:fixed;
    border-collapse:collapse;
    color:var(--text);
    font-size:.9rem;
}

#historyTable th,
#historyTable td{
    width:33.33%;
    text-align:center;
    vertical-align:middle;
}

#historyTable thead{
    color:var(--muted);
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
}

#historyTable tbody{
    display:block;
    overflow:auto;
    max-height:min(500px,55vh);
}

#historyTable tr{
    display:table;
    width:100%;
    cursor:pointer;
}

#historyTable td{
    padding:12px;
    border-bottom:1px solid rgba(255,255,255,.08);
    color:var(--text);
}

#historyTable tbody tr{
    transition:background .2s;
}

#historyTable tbody tr:hover{
    background:rgba(255,255,255,.06);
}

/* ---------- Setup ---------- */

.position-controls,
.history-buttons{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    align-items:center;
}

.position-controls{
    flex-direction:column;
    margin-top:10px;
}

.position-controls label{
    font-size:.82rem;
    font-weight:600;
    letter-spacing:.08em;
    color:var(--muted);
    text-transform:uppercase;
}

.position-controls input{
    width:min(100%,320px);
    padding:14px 18px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.05);
    color:var(--text);
    backdrop-filter:blur(18px);
}

.hint{
    color:var(--muted);
    font-size:.82rem;
    line-height:1.6;
}

.flash-success{
    box-shadow:0 0 18px #00ff88;
}

.flash-error{
    box-shadow:0 0 18px #ff4444;
}

/* ---------- Modal / buttons ---------- */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    display:flex;
    justify-content:center;
    align-items:center;
    opacity:0;
    pointer-events:none;
    transition:.3s;
}

.modal.show{
    opacity:1;
    pointer-events:auto;
}

.modal-card{
    width:min(92vw,380px);
    text-align:center;
    padding:30px;
    border-radius:24px;
    backdrop-filter:blur(18px);
    background:rgba(25,25,35,.92);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:var(--shadow);
}

.modal h2{
    margin-bottom:12px;
    font-size:2rem;
}

.modal p{
    color:var(--muted);
    margin-bottom:22px;
}

button{
    border:none;
    background:white;
    color:#111;
    font-weight:700;
    padding:14px 24px;
    border-radius:14px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px) scale(1.04);
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
    pointer-events:none;
    transform:none;
}

/* ---------- Responsive ---------- */

@media(max-width:1100px){

    .layout{
        grid-template-columns:1fr;
    }

    .sidebar{
        max-width:850px;
        margin:0 auto;
    }

}

@media(max-width:640px){

    .app-shell{
        padding:12px;
    }

    .layout{
        gap:16px;
    }

    .card{
        padding:14px;
        border-radius:18px;
    }

    h1{
        font-size:1.5rem;
    }

    .top{
        flex-direction:column;
        align-items:stretch;
    }

    .turn{
        text-align:center;
    }

    .ai-control{
        display:flex;
        justify-content:center;
    }

    .board{
        gap:6px;
        padding:8px;
    }

    .score{
        min-width:90px;
    }

    .score-strip{
        font-size:.75rem;
        gap:6px;
    }

    .bottom{
        flex-direction:column;
        gap:12px;
    }

    .glass-btn{
        width:100%;
        padding:12px 20px;
    }

}
</style>
</head>

<body>

<div class="app-shell">
    <main class="layout">

        <section class="game-panel">
            <div class="card">

                <h1>CONNECT 4</h1>

                <div class="top">
                    <div class="turn" id="turnIndicator">🔴 Red's Turn</div>

                    <div class="ai-control">
                        <div id="aiToggle" class="ai-switch" role="group" aria-label="AI player">
                            <button type="button" class="ai-option active" data-mode="0">Off</button>
                            <button type="button" class="ai-option" data-mode="1">Auto 🔴</button>
                            <button type="button" class="ai-option" data-mode="2">Auto 🟡</button>
                        </div>
                    </div>
                </div>

                <div class="board-wrap">
                    <div id="board" class="board"></div>
                </div>

                <div id="scoreStrip" class="score-strip"></div>

                <div class="bottom">
                    <button id="resetBtn" class="glass-btn">New Game</button>
                    <div id="analysisText">Analysis unavailable</div>
                    <button id="analyzeToggle" class="glass-btn">Analyze</button>
                </div>

            </div>
        </section>

        <aside class="sidebar">
            <div class="tab-panel">

                <div class="tab-header">
                    <button class="tab active" data-tab="dimensions">Dimensions</button>
                    <button class="tab" data-tab="history">History</button>
                    <button class="tab" data-tab="setup">Setup</button>
                </div>

                <div class="tab-content">

                    <section class="tab-view active" id="dimensions">
                        <div class="slider-group">

                            <label>
                                Rows
                                <input type="range" id="rowsSlider" min="4" max="10" value="6">
                                <div class="slider-scale" aria-hidden="true">
                                    <span>4</span><span>5</span><span>6</span><span>7</span>
                                    <span>8</span><span>9</span><span>10</span>
                                </div>
                            </label>

                            <label>
                                Columns
                                <input type="range" id="colsSlider" min="4" max="10" value="7">
                                <div class="slider-scale" aria-hidden="true">
                                    <span>4</span><span>5</span><span>6</span><span>7</span>
                                    <span>8</span><span>9</span><span>10</span>
                                </div>
                            </label>

                        </div>
                    </section>

                    <section class="tab-view" id="history">
                        <table id="historyTable">
                            <thead>
                                <tr>
                                    <th>Move</th>
                                    <th>Column</th>
                                    <th>Player</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </section>

                    <section class="tab-view" id="setup">
                        <div class="position-controls">
                            <label for="positionInput">Position String</label>
                            <input id="positionInput" type="text" placeholder="Example: 4452301">
                            <p class="hint">Press Enter to apply.</p>
                            <button id="copyPosition" class="glass-btn">Copy Position</button>
                        </div>
                    </section>

                </div>

            </div>
        </aside>

    </main>
</div>

<div class="modal" id="modal">
    <div class="modal-card">
        <h2 id="winnerText">Winner!</h2>
        <p>Congratulations!</p>
        <button id="playAgain">Play Again</button>
    </div>
</div>

<script type="module">
/*
=========================================
CONNECT 4

0 = Empty
1 = Red
2 = Yellow

This implementation includes:
- Local multiplayer
- Score persistence until refresh
- Ghost landing preview
- Animated falling tokens
- Win detection
- Solvers for 7x6 (per-column scores) and 7x5 (async best move) boards
=========================================
*/
import createModule from "./Connect-4-Solvers.js";

// AI mode: 0 = Off, 1 = AI plays Red, 2 = AI plays Yellow
let aiMode = 0;

let cachedScores = null;
let wasmModule = null;
let solver = null;
let solverLoaded = false;
let analyzeEnabled = false;

// ---------- 7x5 solver state (c4/ui/artifact/wasm) ----------
// This solver runs asynchronously on worker threads and reports results
// through the "solve_events" BroadcastChannel (see c4/ui/library.js).
let solver5 = null;          // Module.Solver instance
let position5 = null;        // Module.Position mirror used for solving
let solver5Loaded = false;
let solver5Error = null;     // Load/startup error message, if any
let syncedMoves5 = [];       // Moves currently applied to position5
let solveQueue5 = [];        // Pending solve jobs: {movesStr, resolve}
let activeSolve5 = null;     // Job currently being solved
let movesLeft5 = null;       // Per-column moves-to-game-end for 7x5 analysis
let analyze5For = null;      // positionString of the running 7x5 analysis

// Current board dimensions
let rows = 6;
let cols = 7;

// Current board state
let board = [];
let positionString = "";

// Current player
let currentPlayer = 1;

let moves = [0, 0];
let gameOver = false;

// ---------- History ----------
let history = [];
let historyIndex = -1;

let scores = { red: 0, yellow: 0 };

const boardElement = document.getElementById("board");
const turnIndicator = document.getElementById("turnIndicator");
const modal = document.getElementById("modal");
const winnerText = document.getElementById("winnerText");

function initBoard(){
    board = Array.from({ length: rows }, () => Array(cols).fill(0));

    currentPlayer = 1;
    gameOver = false;

    history = [];
    historyIndex = -1;
    positionString = "";

    document.querySelector("#historyTable tbody").innerHTML = "";

    cancelSolves5();
    updateTurn();
    renderBoard();
    initializeSolver();
    updateAnalysis();
    updateAIButton();
    updateAnalyzeButton();
    maybePlayAI();
}

function is7x6(){ return rows === 6 && cols === 7; }
function is7x5(){ return rows === 5 && cols === 7; }
function solverSupported(){ return is7x6() || is7x5(); }

async function initializeSolver(){
    if(!is7x6()){
        solver = null;
        solverLoaded = false;
        return;
    }

    if(solverLoaded) return;

    wasmModule = await createModule();
    solver = new wasmModule.Solver_7x6();
    solverLoaded = true;

    updateAnalysis();
}

// ---------- 7x5 solver ----------

function initializeSolver5(){
    if(solver5Loaded || !window.Module?.ready) return;

    solver5 = new Module.Solver();
    position5 = new Module.Position();
    solver5Loaded = true;

    updateAnalysis();
    maybePlayAI();
}

if(window.Module?.ready) initializeSolver5();
else window.addEventListener("solver5x7-ready", initializeSolver5);

window.addEventListener("solver5x7-error", () => {
    solver5Error = `7x5 solver failed to load: ${window.Module?.loadError ?? "unknown error"}`;
    updateAnalysis();
});

// The multithreaded 7x5 solver needs SharedArrayBuffer. If coi-serviceworker
// could not enable cross-origin isolation (e.g. the page was opened from
// file:// or the service worker was blocked), say so instead of failing
// silently.
window.addEventListener("load", () => {
    setTimeout(() => {
        if(!solver5Loaded && !solver5Error && !window.crossOriginIsolated){
            solver5Error =
                "7x5 solver unavailable: page is not cross-origin isolated. " +
                "Serve this folder over HTTP (e.g. python3 serve.py) and reload.";
            updateAnalysis();
        }
    }, 3000);
});

/*
All solves go through a queue: the solver handles one position at a time
and reports results on the BroadcastChannel as
{type:"solved", score, bestMove, movesLeft}, {type:"won", score} for
positions that are already over, or {type:"cancelled"}.
*/
const solveChannel = new BroadcastChannel("solve_events");

function solvePosition5(movesStr){
    return new Promise(resolve => {
        solveQueue5.push({ movesStr, resolve });
        pumpSolveQueue5();
    });
}

function pumpSolveQueue5(){
    if(activeSolve5 || !solveQueue5.length || !solver5Loaded) return;

    activeSolve5 = solveQueue5.shift();

    // Mirror the requested position into the solver's Position object.
    while(syncedMoves5.length) position5.unmove(syncedMoves5.pop());

    for(const ch of activeSolve5.movesStr){
        const col = Number(ch);
        position5.move(col);
        syncedMoves5.push(col);
    }

    Module.solve_async(solver5, position5);
}

solveChannel.onmessage = (event) => {
    const job = activeSolve5;
    activeSolve5 = null;

    if(job) job.resolve(event.data);

    pumpSolveQueue5();
};

// Drop all pending work; called whenever the game position changes.
function cancelSolves5(){
    solveQueue5.forEach(job => job.resolve({ type: "cancelled" }));
    solveQueue5 = [];

    if(activeSolve5 && solver5) solver5.cancel();
}

/*
The 7x5 solver returns a single score per solve (unlike the 7x6 solver's
per-column vector), so analysis solves each playable child position and
negates the result back to the current player's perspective. Scores land
in `cachedScores` with the same convention as the 7x6 strip: positive =
current player wins (bigger = sooner), 0 = draw, negative = loses,
-100 = full column — so the score strip and heatmap render identically.
*/
async function analyze5(){
    const base = positionString;

    if(analyze5For === base) return; // Already analyzing this position.
    analyze5For = base;

    const scores = Array(cols).fill(null);
    const movesVia = Array(cols).fill(null);

    cachedScores = scores;
    movesLeft5 = movesVia;

    analysisText.textContent = "Solving...";
    renderScoreStrip();

    for(let c = 0; c < cols; c++){
        if(lowestRow(c) === -1){
            scores[c] = -100; // Full column.
            continue;
        }

        const data = await solvePosition5(base + c);

        // Abort if the game moved on while this column was solving.
        const stale =
            data.type === "cancelled" ||
            positionString !== base ||
            !analyzeEnabled ||
            !is7x5();

        if(stale){
            if(analyze5For === base) analyze5For = null;
            return;
        }

        // Child scores are from the opponent's perspective: negate.
        scores[c] = -data.score;
        movesVia[c] = data.type === "won" ? 1 : data.movesLeft + 1;

        renderScoreStrip();

        const cell = boardElement.children[lowestRow(c) * cols + c];
        if(cell) applyHeat(cell, scores[c]);
    }

    analyze5For = null;

    let best = -Infinity;
    let bestCol = -1;

    for(let c = 0; c < cols; c++){
        if(scores[c] !== -100 && scores[c] > best){
            best = scores[c];
            bestCol = c;
        }
    }

    if(bestCol === -1) return;

    analysisText.textContent = scoreToText5(best, movesVia[bestCol]);
    renderScoreStrip();
}

function scoreToText5(score, movesVia){
    const player = currentPlayer === 1 ? "Red" : "Yellow";

    if(score === 0) return `${player} can Draw`;

    const result = score > 0 ? "Wins" : "Loses";

    return `${player} ${result} in ${movesVia} Move${movesVia === 1 ? "" : "s"}`;
}

// The AI plays the solver's best move once the async solve resolves.
async function playAI5(){
    const base = positionString;
    const data = await solvePosition5(base);

    if(data.type !== "solved") return;
    if(positionString !== base || !is7x5() || gameOver) return;
    if(aiMode === 0 || currentPlayer !== aiMode) return;

    dropPiece(data.bestMove);
}

function resizeBoard(){
    // Fit the board inside its container and the viewport on any device.
    const wrapWidth = boardElement.parentElement.clientWidth || window.innerWidth;
    const maxWidth = Math.min(wrapWidth, 760);
    const maxHeight = Math.min(window.innerHeight * 0.62, 620);

    const ratio = cols / rows;

    let width = Math.min(maxHeight * ratio, maxWidth);
    let height = width / ratio;

    if(height > maxHeight){
        height = maxHeight;
        width = height * ratio;
    }

    boardElement.style.width = `${width}px`;
    boardElement.style.height = `${height}px`;

    const scoreStrip = document.getElementById("scoreStrip");
    const boardStyles = getComputedStyle(boardElement);

    scoreStrip.style.width = `${width}px`;
    scoreStrip.style.columnGap = boardStyles.columnGap;
    scoreStrip.style.paddingLeft = boardStyles.paddingLeft;
    scoreStrip.style.paddingRight = boardStyles.paddingRight;
}

function renderBoard(){
    resizeBoard();

    boardElement.style.gridTemplateColumns = `repeat(${cols},1fr)`;
    boardElement.style.gridTemplateRows = `repeat(${rows},1fr)`;
    boardElement.innerHTML = "";

    for(let r = 0; r < rows; r++){
        for(let c = 0; c < cols; c++){

            const cell = document.createElement("div");
            cell.className = "cell";
            cell.dataset.row = r;
            cell.dataset.col = c;

            cell.addEventListener("click", () => dropPiece(c));
            cell.addEventListener("mouseenter", () => showGhost(c));
            cell.addEventListener("mouseleave", clearGhost);

            if(board[r][c] !== 0){
                const token = document.createElement("div");
                token.className = "token show " + (board[r][c] === 1 ? "red" : "yellow");
                cell.appendChild(token);
            }

            boardElement.appendChild(cell);

            if(analyzeEnabled && cachedScores && r === lowestRow(c)){
                applyHeat(cell, cachedScores[c]);
            }
        }
    }

    // Since cachedScores now also carries 7x5 analysis results, the heat
    // loop above covers both solvers.
}

function applyHeat(cell, score){
    if(score == null || score === -100) return;

    cell.style.boxShadow = `0 0 20px ${scoreColor(score)}`;
    cell.style.borderColor = scoreColor(score);
}

function updateTurn(){
    turnIndicator.innerHTML = currentPlayer === 1 ? "🔴 Red's Turn" : "🟡 Yellow's Turn";
}

function lowestRow(col){
    for(let r = rows - 1; r >= 0; r--){
        if(board[r][col] === 0) return r;
    }
    return -1;
}

function dropPiece(col){
    if(gameOver) return;

    const row = lowestRow(col);
    if(row === -1) return; // Full column

    cancelSolves5();

    board[row][col] = currentPlayer;
    positionString += col.toString();

    saveHistory(col);
    renderBoard();

    if(checkWinner(row, col, currentPlayer)){
        gameOver = true;
        winnerText.innerHTML = currentPlayer === 1 ? "🔴 Red Wins!" : "🟡 Yellow Wins!";
        setTimeout(() => { modal.classList.add("show"); }, 350);
        return;
    }

    if(board.flat().every(v => v !== 0)){
        gameOver = true;
        winnerText.innerHTML = "🤝 Draw!";
        setTimeout(() => { modal.classList.add("show"); }, 350);
        return;
    }

    currentPlayer = currentPlayer === 1 ? 2 : 1;

    updateTurn();
    maybePlayAI();
    updateAnalysis();
}

function countDirection(row, col, dr, dc, player){
    let count = 0;
    let r = row + dr;
    let c = col + dc;

    while(r >= 0 && r < rows && c >= 0 && c < cols && board[r][c] === player){
        count++;
        r += dr;
        c += dc;
    }

    return count;
}

function checkWinner(row, col, player){
    const dirs = [[0,1],[1,0],[1,1],[1,-1]];

    for(const [dr, dc] of dirs){
        const total =
            1 +
            countDirection(row, col, dr, dc, player) +
            countDirection(row, col, -dr, -dc, player);

        if(total >= 4) return true;
    }

    return false;
}

function saveHistory(col){
    history = history.slice(0, historyIndex + 1);

    history.push({
        board: board.map(r => [...r]),
        positionString,
        player: currentPlayer,
        col,
        move: history.length
    });

    historyIndex++;
    updateHistoryTable();
}

const rowsSlider = document.getElementById("rowsSlider");
const colsSlider = document.getElementById("colsSlider");

rowsSlider.addEventListener("input", () => { rows = Number(rowsSlider.value); });
colsSlider.addEventListener("input", () => { cols = Number(colsSlider.value); });

rowsSlider.addEventListener("change", initBoard);
colsSlider.addEventListener("change", initBoard);

/*
Ghost preview
Shows where the piece will land.
*/
function clearGhost(){
    document.querySelectorAll(".ghost").forEach(g => g.remove());
}

function showGhost(col){
    if(gameOver) return;

    clearGhost();

    const row = lowestRow(col);
    if(row === -1) return;

    const cell = boardElement.children[row * cols + col];

    const ghost = document.createElement("div");
    ghost.className = "token ghost " + (currentPlayer === 1 ? "red" : "yellow");

    cell.appendChild(ghost);
}

function applyPosition(sequence){
    positionInput.value = "";
    positionString = "";

    initBoard();

    let valid = true;

    for(const ch of sequence){
        const col = Number(ch);

        if(Number.isNaN(col) || col < 0 || col >= cols){
            valid = false;
            continue;
        }

        const row = lowestRow(col);

        if(row === -1){
            valid = false;
            continue;
        }

        board[row][col] = currentPlayer;
        positionString += col;

        saveHistory(col);

        currentPlayer = currentPlayer === 1 ? 2 : 1;
    }

    flashInput(valid);
    renderBoard();
    updateTurn();
    updateAnalysis();
}

function updateHistoryTable(){
    const tbody = document.querySelector("#historyTable tbody");

    tbody.innerHTML = "";

    history.forEach((item, index) => {
        tbody.insertAdjacentHTML(
            "beforeend",
            `<tr data-index="${index}">
                <td>${item.move + 1}</td>
                <td>${item.col}</td>
                <td>${item.player === 1 ? "🔴" : "🟡"}</td>
            </tr>`
        );
    });
}

function flashInput(success){
    positionInput.classList.remove("flash-success", "flash-error");
    positionInput.classList.add(success ? "flash-success" : "flash-error");

    setTimeout(() => {
        positionInput.classList.remove("flash-success", "flash-error");
    }, 450);
}

function scoreToText(score){
    const player = currentPlayer === 1 ? "Red" : "Yellow";

    if(score === 0) return `${player} can Draw`;
    if(score === -100) return `${player} Loses in 1 Move`;

    if(score > 0){
        const moves = 42 + currentPlayer - 2 * score - positionString.length;
        return `${player} Wins in ${moves} Move${moves === 1 ? "" : "s"}`;
    }

    const moves = 45 - currentPlayer + 2 * score - positionString.length;
    return `${player} Loses in ${moves} Move${moves === 1 ? "" : "s"}`;
}

function updateAnalysis(){
    if(is7x5()){
        if(!solver5Loaded){
            cachedScores = null;
            renderScoreStrip();
            analysisText.textContent = solver5Error ?? "Loading 7x5 solver...";
            return;
        }

        if(gameOver || !analyzeEnabled){
            cachedScores = null;
            renderScoreStrip();
            analysisText.textContent = "";
            return;
        }

        // Skip analysis while the AI is about to move; the position is
        // analyzed again right after its move.
        if(aiMode !== 0 && currentPlayer === aiMode){
            cachedScores = null;
            renderScoreStrip();
            analysisText.textContent = "Solving...";
            return;
        }

        analyze5();
        return;
    }

    if(!solverLoaded){
        cachedScores = null;
        analysisText.textContent = "";

        renderScoreStrip();

        if(analyzeEnabled) renderBoard();

        return;
    }

    updateSolverScores();

    if(analyzeEnabled) {

        renderScoreStrip();

        let best = -Infinity;

        for(let i = 0; i < cachedScores.length; i++){
            best = Math.max(best, cachedScores[i]);
        }
        analysisText.textContent = scoreToText(best);
    } else {
        renderScoreStrip();
        analysisText.textContent = "";
    }
    renderBoard();
}

const aiButton = document.getElementById("aiToggle");
const aiOptions = Array.from(aiButton.querySelectorAll(".ai-option"));

function updateAIButton(){
    if(!solverSupported()){
        aiButton.setAttribute("aria-disabled", "true");
        aiButton.disabled = true;
        aiButton.title = "AI only supports 7 × 6 and 7 × 5 boards.";

        aiOptions.forEach(option => {
            option.disabled = true;
            option.classList.remove("active");
            option.setAttribute("aria-pressed", "false");
        });

        return;
    }

    aiButton.removeAttribute("aria-disabled");
    aiButton.disabled = false;
    aiButton.title = "";

    aiOptions.forEach(option => {
        const isActive = Number(option.dataset.mode) === aiMode;

        option.disabled = false;
        option.classList.toggle("active", isActive);
        option.setAttribute("aria-pressed", String(isActive));
    });

    maybePlayAI();
}

const analyzeButton = document.getElementById("analyzeToggle");

function updateAnalyzeButton(){
    if(!solverSupported()){
        analyzeButton.disabled = true;
        analyzeEnabled = false;
        analyzeButton.title = "Analysis only supports 7 × 6 and 7 × 5 boards.";

        updateAnalysis();
        return;
    }

    analyzeButton.disabled = false;
    analyzeButton.title = "";
}

aiButton.addEventListener("click", (event) => {
    const option = event.target.closest(".ai-option");

    if(!option || !solverSupported()) return;

    aiMode = Number(option.dataset.mode);
    updateAIButton();
});

function maybePlayAI(){
    if(aiMode === 0) return;
    if(currentPlayer !== aiMode) return;
    if(gameOver) return;

    // The 7x5 solver is async: the move is played when the result arrives.
    if(is7x5()){
        if(solver5Loaded) playAI5();
        return;
    }

    if(!solverLoaded) return;

    updateSolverScores();

    let best = -Infinity;

    cachedScores.forEach(v => {
        if(v > best) best = v;
    });

    const choices = [];

    cachedScores.forEach((v, i) => {
        if(v === best) choices.push(i);
    });

    if(!choices.length) return;

    const move = choices[Math.floor(Math.random() * choices.length)];

    if(!gameOver) dropPiece(move);
}

function renderScoreStrip(){
    const strip = document.getElementById("scoreStrip");

    strip.style.gridTemplateColumns = `repeat(${cols},1fr)`;
    strip.innerHTML = "";

    if(!analyzeEnabled || !cachedScores) return;

    // null entries are columns the 7x5 analysis has not solved yet.
    const resolved = cachedScores.filter(v => v !== null);
    const best = resolved.length ? Math.max(...resolved) : null;

    cachedScores.forEach(score => {
        const div = document.createElement("div");

        if(score === null){
            div.className = "score-value";
            div.textContent = "…";
        }else{
            div.className = score === best ? "score-value best" : "score-value";
            div.textContent = score === -100 ? "X" : score;
            div.style.color = scoreColor(score);
        }

        strip.appendChild(div);
    });
}

function scoreColor(score){
    if(score === -100) return "rgba(255,255,255,.15)";

    const minScore = -18;
    const maxScore = 18;

    score = Math.max(minScore, Math.min(maxScore, score));

    if(score === 0) return "hsl(52 100% 58%)";

    if(score < 0){
        const t = (score - minScore) / (-1 - minScore);
        const lightness = 38 + t * 24;
        const saturation = 88 - t * 8;
        return `hsl(0 ${saturation}% ${lightness}%)`;
    }

    const t = (score - 1) / (maxScore - 1);
    const lightness = 68 - t * 28;
    const saturation = 62 + t * 28;
    return `hsl(135 ${saturation}% ${lightness}%)`;
}

function updateSolverScores(){
    if(!solverLoaded){
        cachedScores = null;
        return;
    }

    const result = solver.bestMove(positionString);

    cachedScores = [];

    for(let i = 0; i < result.size(); i++){
        cachedScores.push(result.get(i));
    }
}

document.getElementById("playAgain").addEventListener("click", () => {
    modal.classList.remove("show");
    initBoard();
});

document.querySelector("#historyTable tbody").addEventListener("click", (e) => {
    const row = e.target.closest("tr");
    if(!row) return;

    const index = Number(row.dataset.index);
    const state = history[index];

    historyIndex = index;

    cancelSolves5();

    board = state.board.map(r => [...r]);
    positionString = state.positionString;
    currentPlayer = 3 - state.player;

    updateAnalysis();
    renderBoard();
    updateTurn();
});

document.getElementById("resetBtn").addEventListener("click", initBoard);

document.querySelector(".tab-header").addEventListener("click", (e) => {
    const button = e.target.closest(".tab");
    if(!button) return;

    document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
    button.classList.add("active");

    document.querySelectorAll(".tab-view").forEach(v => v.classList.remove("active"));
    document.getElementById(button.dataset.tab).classList.add("active");
});

const positionInput = document.getElementById("positionInput");

positionInput.addEventListener("keydown", (event) => {
    if(event.key !== "Enter") return;

    applyPosition(positionInput.value.trim());
});

document.getElementById("analyzeToggle").addEventListener("click", () => {
    if(analyzeButton.disabled) return;

    analyzeEnabled = !analyzeEnabled;

    updateAnalysis();
    renderBoard();
});

document.getElementById("copyPosition").addEventListener("click", async () => {
    await navigator.clipboard.writeText(positionString);

    const button = document.getElementById("copyPosition");

    button.textContent = "Copied!";

    setTimeout(() => { button.textContent = "Copy Position"; }, 1200);
});

// Keep the board sized correctly when the window or orientation changes.
window.addEventListener("resize", resizeBoard);

initBoard();

</script>
